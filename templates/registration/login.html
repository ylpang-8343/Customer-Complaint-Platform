{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block shell %}
<div class="login-page">
  <div class="login-brand"><span class="logo-chip">BEST</span><span class="logo-name">Complaints</span></div>
  <section class="card login-card">
    <h1>Sign in</h1>
    <form method="post">
      {% csrf_token %}
      {% if form.non_field_errors %}<div class="alert error" role="alert">{{ form.non_field_errors }}</div>{% endif %}
      <div class="field"><label for="{{ form.username.id_for_label }}">Username</label>{{ form.username }}</div>
      <div class="field"><label for="{{ form.password.id_for_label }}">Password</label>{{ form.password }}</div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="button primary" type="submit">Sign in</button>
    </form>
  </section>
</div>
{% endblock %}
