# Render Blueprint: one free web service and one free PostgreSQL database, for a demo.
# In Render: New > Blueprint, choose this repository. See docs/Deployment.md.
databases:
  - name: complaints-db
    plan: free
    databaseName: complaints
    user: complaints

services:
  - type: web
    name: customer-complaint-platform
    runtime: python
    plan: free
    buildCommand: bash build.sh
    # One worker with threads keeps to the 512 MB of the free plan.
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: complaints-db
          property: connectionString
      # A demo: show the demo users on the sign-in page and load twelve demo complaints at each deploy
      # (only when the database has none). Remove both for a real site.
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_DATA
        value: "1"
